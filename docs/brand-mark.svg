<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chrome Reference Drop brand mark
  Equal columns + inset padding so logos breathe from the tile edges.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chrome to Blender">
  <title>Chrome Reference Drop</title>
  <defs>
    <linearGradient id="crd-cr" x1="3.2173" y1="15" x2="44.7812" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d93025"/>
      <stop offset="1" stop-color="#ea4335"/>
    </linearGradient>
    <linearGradient id="crd-cy" x1="20.7219" y1="47.6791" x2="41.5039" y2="11.6837" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcc934"/>
      <stop offset="1" stop-color="#fbbc04"/>
    </linearGradient>
    <linearGradient id="crd-cg" x1="26.5981" y1="46.5015" x2="5.8161" y2="10.506" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e8e3e"/>
      <stop offset="1" stop-color="#34a853"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#12161f"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" fill="none" stroke="#2a3344" stroke-width="1"/>

  <!--
    Content inset: 14px from edges → work area [14..114] (100×100)
    Three equal columns of width 100/3 ≈ 33.333
      col1 center x = 14 + 16.667 = 30.667
      col2 center x = 64
      col3 center x = 97.333
    Logo size 30×30 (was ~36) for a bit more breathing room.
  -->

  <!-- Chrome: 48→30, center (30.667, 64) -->
  <g transform="translate(15.667, 49) scale(0.625)">
    <circle cx="24" cy="23.9947" r="12" fill="#fff"/>
    <path d="M24,12H44.7812a23.9939,23.9939,0,0,0-41.5639.0029L13.6079,30l.0093-.0024A11.9852,11.9852,0,0,1,24,12Z" fill="url(#crd-cr)"/>
    <circle cx="24" cy="24" r="9.5" fill="#1a73e8"/>
    <path d="M34.3913,30.0029,24.0007,48A23.994,23.994,0,0,0,44.78,12.0031H23.9989l-.0025.0093A11.985,11.985,0,0,1,34.3913,30.0029Z" fill="url(#crd-cy)"/>
    <path d="M13.6086,30.0031,3.218,12.006A23.994,23.994,0,0,0,24.0025,48L34.3931,30.0029l-.0067-.0068a11.9852,11.9852,0,0,1-20.7778.007Z" fill="url(#crd-cg)"/>
  </g>

  <!-- Arrow centered at (64, 64), slightly smaller -->
  <g fill="#ea7600" transform="translate(64, 64)">
    <rect x="-9.5" y="-3" width="10" height="6" rx="1.1"/>
    <path d="M0 -7.5 L10 0 L0 7.5 Z"/>
  </g>

  <!-- Blender: height 30, center (97.333, 64)
       scale = 30/148; width ≈ 36.69; left = 97.333 - 18.345 = 78.988 -->
  <g transform="translate(78.988, 49) scale(0.2027)">
    <g transform="matrix(.281 0 0 .281 -41.8 -43.7)">
      <g transform="matrix(21.6 0 0 21.6 -4857 7665)">
        <path d="m243-334c0.106-1.89 1.03-3.56 2.43-4.74 1.37-1.16 3.21-1.87 5.23-1.87 2.01 0 3.85 0.709 5.22 1.87 1.4 1.18 2.32 2.85 2.43 4.74 0.106 1.94-0.675 3.75-2.04 5.09-1.4 1.36-3.38 2.22-5.61 2.22s-4.22-0.854-5.61-2.22c-1.37-1.34-2.15-3.14-2.04-5.08z" fill="#fff"/>
      </g>
      <g transform="matrix(11.1 0 0 11.1 -2215 4153)">
        <path d="m243-334c0.106-1.89 1.03-3.56 2.43-4.74 1.37-1.16 3.21-1.87 5.23-1.87 2.01 0 3.85 0.709 5.22 1.87 1.4 1.18 2.32 2.85 2.43 4.74 0.106 1.94-0.675 3.75-2.04 5.09-1.4 1.36-3.38 2.22-5.61 2.22s-4.22-0.854-5.61-2.22c-1.37-1.34-2.15-3.14-2.04-5.08z" fill="#265787"/>
        <path d="m231-330c0.013 0.74 0.249 2.18 0.603 3.3 0.744 2.38 2.01 4.58 3.76 6.51 1.8 1.99 4.02 3.59 6.58 4.73 2.69 1.19 5.61 1.8 8.64 1.8 3.03-4e-3 5.95-0.624 8.64-1.83 2.56-1.15 4.78-2.75 6.58-4.75 1.76-1.95 3.02-4.15 3.76-6.53 0.375-1.2 0.612-2.42 0.707-3.64 0.093-1.2 0.054-2.41-0.117-3.62-0.334-2.35-1.15-4.56-2.4-6.56-1.14-1.85-2.62-3.46-4.38-4.82l4e-3 -3e-3 -17.7-13.6c-0.016-0.012-0.029-0.025-0.046-0.036-1.16-0.892-3.12-0.889-4.39 5e-3 -1.29 0.904-1.44 2.4-0.29 3.34l-5e-3 5e-3 7.39 6.01-22.5 0.024h-0.03c-1.86 2e-3 -3.65 1.22-4 2.77-0.364 1.57 0.9 2.88 2.84 2.88l-3e-3 7e-3 11.4-0.022-20.4 15.6c-0.026 0.019-0.054 0.039-0.078 0.058-1.92 1.47-2.54 3.92-1.33 5.46 1.23 1.57 3.84 1.58 5.78 9e-3l11.1-9.1s-0.162 1.23-0.149 1.96zm28.6 4.11c-2.29 2.33-5.5 3.66-8.96 3.66-3.47 6e-3 -6.68-1.3-8.97-3.63-1.12-1.14-1.94-2.44-2.45-3.83-0.497-1.37-0.69-2.82-0.562-4.28 0.121-1.43 0.547-2.8 1.23-4.03 0.668-1.21 1.59-2.31 2.72-3.24 2.23-1.81 5.06-2.8 8.02-2.8 2.97-4e-3 5.8 0.969 8.03 2.78 1.13 0.924 2.05 2.02 2.72 3.23 0.683 1.23 1.11 2.59 1.23 4.03 0.126 1.46-0.067 2.91-0.564 4.28-0.508 1.4-1.33 2.7-2.45 3.84z" fill="#ea7600"/>
      </g>
    </g>
  </g>
</svg>
